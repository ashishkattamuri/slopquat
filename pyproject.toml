[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopquat"
version = "0.1.0"
description = "Catch AI-hallucinated package names (slopsquatting) before they reach your lockfile — pip, pyproject, npm, and Python imports, verified against live registries."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashish Kattamuri" }]
keywords = [
  "slopsquatting", "supply-chain", "supply-chain-security", "hallucination",
  "llm", "ai", "security", "pip", "pypi", "npm", "slop",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ashishkattamuri/slopquat"
Issues = "https://github.com/ashishkattamuri/slopquat/issues"

[project.scripts]
slopquat = "slopquat.cli:main"

[tool.setuptools.packages.find]
include = ["slopquat*"]